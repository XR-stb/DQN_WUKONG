capture:
  backend: wgc
  window_title: "b1  "
  width: 1280
  height: 720
  observation_width: 160
  observation_height: 90
  allow_dxcam_fallback: false
  dxcam_osd_disabled: false
  process_isolation: true
  worker_fps: 30.0
environment:
  boss_id: yinhu
  control_hz: 8.0
  ready_timeout_seconds: 60.0
  episode_timeout_seconds: 300.0
  terminal_confirm_frames: 3
  terminal_health_percent: 1.0
  terminal_inference_health_percent: 3.0
  recognition_failure_seconds: 3.0
  minimum_confidence: 0.55
  # Q is allowed only at or below this reliable player-health percentage.
  potion_health_threshold_percent: 60.0
  maximum_idle_ticks: 8
  idle_escape_ticks: 4
  restart_action: FUZHAN_STAND_RESTART
reward:
  boss_damage_per_percent: 0.1
  self_damage_per_percent: -0.12
  tick_penalty: -0.001
  win_reward: 10.0
  loss_reward: -10.0
  nonterminal_clip: 2.0
perception:
  opencv_threads: 1
  base_width: 1280
  base_height: 720
  confirm_frames: 3
  minimum_confidence: 0.55
  maximum_jump_percent: 35.0
  boss_increase_tolerance: 1.5
  regions:
    self_blood: [138, 655, 345, 664]
    boss_blood: [512, 609, 776, 616]
    self_magic: [141, 669, 366, 675]
    self_energy: [140, 678, 352, 682]
    hulu: [82, 645, 88, 679]
    skill_1: [1110, 571, 1120, 580]
    skill_2: [1147, 571, 1156, 580]
    skill_3: [1184, 571, 1193, 580]
    skill_4: [1221, 571, 1230, 580]
    skill_ts: [995, 694, 1005, 703]
    skill_fb: [1061, 694, 1071, 703]
    gunshi1: [1191, 691, 1198, 697]
    gunshi2: [1205, 681, 1211, 686]
    gunshi3: [1211, 663, 1219, 671]
  ranges: {}
telemetry:
  # off: screen only; prefer: fresh telemetry with screen fallback; required: fail closed
  mode: prefer
  pipe_name: wukong_rl_telemetry
  max_age_seconds: 0.35
  reconnect_seconds: 1.0
  # Calibrated from Evt_UnitCastSkillSuccess for the current Yinhu loadout.
  # Recalibrate after changing equipped spells.
  skill_ids: [10518, 10095, 10516, 10424]
  # Empty accepts the current lock target; add Yinhu's res_id after probing.
  accepted_boss_res_ids: []
model:
  hidden_size: 256
  gamma: 0.997
  n_step: 5
  burn_in: 8
  unroll: 32
  batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.00001
  gradient_clip: 10.0
  target_update_interval: 2000
  demo_margin: 0.8
  demo_loss_weight: 1.0
replay:
  directory: artifacts/replay
  capacity_frames: 200000
  priority_alpha: 0.6
  priority_beta_start: 0.4
  demo_ratio: 0.25
  minimum_sequences: 64
training:
  checkpoint_directory: artifacts/checkpoints
  dataset_directory: artifacts/datasets
  metrics_directory: artifacts/metrics
  actor_epsilon_start: 0.2
  actor_epsilon_end: 0.02
  epsilon_decay_steps: 100000
  weight_sync_seconds: 2.0
  updates_per_environment_step: 0.25
  checkpoint_interval_seconds: 300.0
  actor_cpu_threads: 4
  random_seed: 7
monitoring:
  enabled: true
  directory: artifacts/profiles
  resource_interval_seconds: 1.0
  summary_interval_seconds: 5.0
  queue_capacity: 2048
  quantile_window: 4096
  deadline_tolerance_ms: 5.0
  game_process_name: b1-Win64-Shipping.exe
  gpu_enabled: true
  gpu_index: 0
