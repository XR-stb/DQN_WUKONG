# ============================================================
# 🎮 游戏窗口与UI识别配置
# ============================================================
# 新用户请重点关注以下两项:
#   1. game_window.width / height - 修改为你的游戏分辨率
#   2. boss_blood_presets - 选择你要打的Boss对应的血条坐标
# ============================================================

# --- 游戏窗口分辨率 ---
game_window:
  width: 1280          # ← 修改为你的游戏窗口宽度
  height: 720          # ← 修改为你的游戏窗口高度 (默认 width * 0.5625)

# --- 基准分辨率 (勿动，所有坐标基于此分辨率标定) ---
base_resolution:
  width: 1280
  height: 720

# --- ROI 区域 (战斗画面截取区域，以游戏窗口中心为中心) ---
roi:
  x_size: 300          # ROI宽度
  y_size: 400          # ROI高度

# --- Boss血条坐标预设 ---
# 每个Boss的血条位置不同，选择你要打的Boss取消注释即可
# 坐标格式: [sx, sy, ex, ey] (基于 base_resolution)
boss_blood_presets:
  寅虎:     [512, 609, 776, 616]
  虎先锋:   [460, 609, 836, 616]
  广谋:     [510, 609, 776, 616]
  青背龙:   [455, 609, 836, 616]   # ← 当前选中

# 当前使用的Boss (修改这里切换Boss)
active_boss: '寅虎'

# --- 玩家状态UI坐标 (基于 base_resolution，通常无需修改) ---
ui_coordinates:
  self_blood:   [138, 655, 345, 664]
  self_magic:   [141, 669, 366, 675]
  self_energy:  [140, 678, 352, 682]
  skill_1:      [1110, 571, 1120, 580]
  skill_2:      [1147, 571, 1156, 580]
  skill_3:      [1184, 571, 1193, 580]
  skill_4:      [1221, 571, 1230, 580]
  skill_ts:     [995, 694, 1005, 703]
  skill_fb:     [1061, 694, 1071, 703]
  gunshi1:      [1191, 691, 1198, 697]
  gunshi2:      [1205, 681, 1211, 686]
  gunshi3:      [1211, 663, 1219, 671]
  hulu:         [82, 645, 88, 679]
  q_window:     [185, 542, 195, 551]
