[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wukong-rl"
version = "0.2.0"
description = "Screen-control recurrent reinforcement learning pipeline for Black Myth: Wukong"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "opencv-python>=4.10",
  "PyYAML>=6.0",
  "pynput>=1.7",
  "pywin32>=306; platform_system == 'Windows'",
  "torch>=2.5",
  "windows-capture>=1.5; platform_system == 'Windows'",
  "dxcam-cpp; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
dashboard = ["matplotlib>=3.9"]
performance = ["psutil>=5.9", "nvidia-ml-py>=12.0"]

[project.scripts]
wukong-rl = "wukong_rl.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
